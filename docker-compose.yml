# `docker compose up` -> the serving API, plus a demo playback that drives it
# (docs/PRD.md Section 8's proposed architecture; Issue #86).
#
# Two services, one command. `api` serves /predict; `demo` waits for it to report healthy,
# then replays a bearing's run-to-failure history against it and exits. A reviewer running
# `docker compose up` sees real predictions stream past without installing a Python client
# (docs/PRD.md Section 10's "<15 min fresh clone -> running demo").
#
# Scaling caveat, stated rather than left to be discovered: `single_worker.py`'s lock is an
# OS file lock, so it is per-container -- two containers each hold their own /tmp and would
# each believe they are alone. What actually prevents `docker compose up --scale api=2` here
# is the fixed published port below: the second container cannot bind 8000 and fails loudly.
# That is sufficient for this design, because multi-worker/horizontal serving is an explicit
# non-goal (docs/serving_design.md Section 5) -- correct rolling state across replicas needs
# the shared store that document rules out.
#
# `qdrant`, below, is the one service gated behind the `agent` compose profile (M7,
# docs/agent_design.md Section 3). Plain `docker compose up` never starts it -- Compose
# skips any service carrying a `profiles:` list unless that profile is explicitly
# requested, so the default path stays exactly `api` + `demo` and docs/PRD.md Section 10's
# fresh-clone criterion (~71s to a healthy API, no dataset download, re-verified #92) is
# unaffected. `docker compose --profile agent up` additionally starts it. The agent layer
# needs an `ANTHROPIC_API_KEY` a fresh clone does not have, so it does not meet that
# criterion and does not claim to (docs/agent_design.md Section 3) -- this profile split is
# what keeps that limitation from touching the criterion the MVP does meet.

services:
  api:
    build: .
    image: sentinedge-prognos-serving
    # Fixed host port, not a range: see the scaling caveat above.
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,json,sys; sys.exit(0 if json.load(urllib.request.urlopen('http://localhost:8000/health'))['model_loaded'] else 1)"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  demo:
    build: .
    image: sentinedge-prognos-serving
    depends_on:
      api:
        condition: service_healthy
    # demo/ is deliberately not in the image (see Dockerfile) -- the playback client is not
    # part of the served application. Mounting it read-only keeps that separation while
    # still giving `docker compose up` a one-command demo.
    volumes:
      - ./demo:/app/demo:ro
    environment:
      PYTHONPATH: /app
    # 0.5s rather than docs/PRD.md Section 8's ~2s: the compose path is the "does this work"
    # demo, and 197 snapshots at 2s would be 6.6 minutes before it finished. Run
    # `python -m demo.playback` on the host for the full-cadence version.
    command: ["python", "-m", "demo.playback", "--url", "http://api:8000", "--interval", "0.5"]

  # Vector DB for the RAG index (Issue #98, docs/agent_design.md Section 3). Opt-in only --
  # see the profile note above `services:`. Named volume rather than a bind mount so a
  # collection persists across `docker compose --profile agent up`/`down` cycles but is
  # trivially wiped with `docker compose down -v` (docs/agent_design.md Section 7 uses the
  # same rebuildable-state posture for the inventory SQLite database). Official image, no
  # Dockerfile of our own -- there is no application code to bake in, only the vector store
  # itself; `src/agent/rag/index.py` (run on the host or in a future agent-service
  # container, out of this issue's scope) is the client that populates it.
  qdrant:
    # Pinned to match src/agent/rag/index.py's `qdrant-client==1.18.0` (requirements.txt) --
    # the client warns/errors on a server more than one minor version away, checked
    # empirically against v1.13.4 before landing on this tag.
    image: qdrant/qdrant:v1.18.0
    profiles: ["agent"]
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    # The official image has no curl/wget/python3 (verified: Debian-slim base, coreutils +
    # bash only) -- checked directly rather than assumed, the same "verify, don't assume"
    # discipline as the fastembed dependency check above. `bash`'s `/dev/tcp` pseudo-device
    # is what's actually available, so the healthcheck speaks raw HTTP over it and greps
    # for a 200 -- but Docker's `CMD-SHELL` itself runs under `/bin/sh`, which this image
    # symlinks to `dash`, and dash does not support `/dev/tcp` ("Directory nonexistent",
    # confirmed empirically). Wrapping in an explicit `bash -c` is what actually works; also
    # confirmed empirically, not inferred from the first fix looking plausible.
    healthcheck:
      test: ["CMD-SHELL", "bash -c \"exec 3<>/dev/tcp/localhost/6333 && printf 'GET /healthz HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q '200 OK'\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  qdrant_data:
